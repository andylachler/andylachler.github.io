<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">  <!-- de-indexed Jul 2026; remove this line to go public -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andy Lachler — Product Designer · Andreas Lächler</title>
<meta name="description" content="Andy Lachler (Andreas Lächler) — product designer working across digital and physical. B2B SaaS product design at Algoma; trained as an architect at Pratt and Lehigh. New York.">
<link rel="icon" type="image/svg+xml" href="assets/favicon-lockup.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300..500&display=swap" rel="stylesheet">
<style>
/* P0 — design-language tokens (v4 migration, July 2026) */
:root {
  --ff-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --ff-serif: 'Instrument Serif', 'Times New Roman', serif;
  --ff-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
</style>
<style>
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Inter';
  src: url('fonts/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900; font-style: italic; font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-family: 'Inter', system-ui, sans-serif; background: #F2EFE6; color: #14211C; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
button, a { font-family: inherit; }

/* Page transitions — the exit keyframe MUST end at `transform: none`:
   a retained transform (fill-mode both keeps the last keyframe) turns the
   wrapper into a containing block for position:fixed descendants, which
   breaks fullscreen overlays and fixed rails rendered inside the page. */
.page-enter { animation: pageIn 300ms cubic-bezier(0.22,1,0.36,1) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* Scroll reveal */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 600ms cubic-bezier(0.22,1,0.36,1), transform 600ms cubic-bezier(0.22,1,0.36,1); }
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-delay-1 { transition-delay: 80ms; }
.reveal-delay-2 { transition-delay: 160ms; }
.reveal-delay-3 { transition-delay: 240ms; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="images/manifest.js"></script>
<script src="wireframes-data.js"></script>
<script type="text/babel" src="Gate.jsx"></script>
<script type="text/babel" src="Loader.jsx"></script>
<script type="text/babel" src="Cursor.jsx"></script>
<script type="text/babel" src="ScrollRail.jsx"></script>
<script type="text/babel" src="ProjectTile.jsx"></script>
<script type="text/babel" src="ProjectGrid.jsx"></script>
<script type="text/babel" src="ScrollWork.jsx"></script>
<script type="text/babel" src="Reel.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="HeroBg.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="TryItOut.jsx"></script>
<script type="text/babel" src="BookSpreads.jsx"></script>
<script type="text/babel" src="ProjectPage.jsx"></script>
<script type="text/babel" src="StudyKit.jsx"></script>
<script type="text/babel" src="FullProductStudyPage.jsx"></script>
<script type="text/babel" src="WireframeComponentsPage.jsx"></script>
<script type="text/babel" src="PlatformReportsPage.jsx"></script>
<script type="text/babel" src="ArchivePage.jsx"></script>
<script type="text/babel" src="AboutPage.jsx"></script>

<script type="text/babel">
// ── Tweak defaults ────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "navStyle": "floating",
  "heroLayout": "default",
  "accentColor": "#D45A1B",
  "motionLevel": "standard",
  "workDisplay": "scroll"
}/*EDITMODE-END*/;

// ── Scroll reveal hook ────────────────────────────────────────────────────
const useReveal = () => {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } }),
      { threshold: 0.12 }
    );
    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  });
};

// ── WorkPage ──────────────────────────────────────────────────────────────
// One index for everything (July 2026 continuity pass): the standalone
// Foundations/archive page is retired and its projects live here as sections.
// Cards use the home reel's ReelCard grammar (grid variant) so the card
// design is identical on every page. pid resolution: PROJECT_DATA → project
// page; ARCHIVE_ITEMS → archive-project detail page.
const WorkPage = ({ onNavigate }) => {
  useReveal();
  const isMobile = (window.useIsMobile || (() => false))(768);
  const sections = [
    { org: 'Independent', period: '2022–2026', projects: ['autoease','exhibition-trailer'] },
    { org: 'Algoma — Product', period: '2024–present', projects: ['wireframe-components','platform-reports'],
      note: 'Two showcases of the product work — the component catalog and the reporting logic behind self-service exports.' },
    { org: 'Arquitectonica — Architecture', period: '2022–2024', projects: ['ella','brickell'] },
    { org: 'Foundations — Pratt', period: '2019–2022', projects: ['fluxing','pastoral-urbanity','mesa-verde','elevate-ravenswood','dissection'],
      note: 'Learning to think with my hands — graduate work shown for what it is: model making, material studies, and physical craft.' },
    { org: 'Foundations — Lehigh', period: '2017–2018', projects: ['unit-multiplication','singular-flow','bethlehem-riverfront','bethlehem-culinary','one-room-schoolhouse'],
      note: 'Undergraduate independent studies with Prof. Hyun-Tae Jung — paper and physical models, with the original portfolio-book spreads on each page.' },
    { org: 'Playable', period: '2024', projects: ['ball-game'],
      note: 'Unity / WebGL experiments — architecture-adjacent: terrain, environment, physics, real-time lighting.' },
  ];
  const toCard = (pid) => {
    // bg / imageIndex / silhouette feed ReelCard's linework fallback for
    // projects that don't have a tile image in the manifest yet.
    const p = window.PROJECT_DATA?.[pid];
    if (p) {
      const feat = (window.PROJECTS || []).find(x => x.id === pid) || {};
      return { id: pid, title: p.title, year: String(p.year), cat: (p.role || '').split(' — ')[0] || 'Project', sub: (p.role || '').split(' — ')[1] || '', meta: p.org, nav: ['project', pid],
        bg: p.bg || p.tileBg || feat.bg, imageIndex: p.imageIndex ?? feat.imageIndex, silhouette: p.silhouette || feat.silhouette };
    }
    const a = (window.ARCHIVE_ITEMS || []).find(it => it.id === pid);
    if (a) return { id: pid, title: a.title, year: String(a.year), cat: (a.type || '').split(' — ')[0] || 'Project', sub: (a.type || '').split(' — ')[1] || '', meta: a.org, nav: ['archive-project', pid],
      bg: a.bg, imageIndex: a.imageIndex, silhouette: a.silhouette };
    return null;
  };
  return (
    <main style={{ maxWidth: '1400px', margin: '0 auto', padding: isMobile ? '7rem 1.25rem 4rem' : '8.5rem 2.5rem 5rem' }}>
      <p className="reveal" style={{ fontSize: '11px', fontWeight: 500, fontFamily: 'var(--ff-mono)', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'rgba(20,33,28,0.4)', marginBottom: '3.5rem' }}>Work</p>
      {sections.map((sec, si) => {
        const cards = sec.projects.map(toCard).filter(Boolean);
        if (!cards.length) return null;
        return (
          <div key={si} className="reveal" style={{ marginBottom: '4rem' }}>
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: sec.note ? '0.5rem' : '1.25rem', paddingBottom: '0.75rem', borderBottom: '0.5px solid rgba(20,33,28,0.1)' }}>
              <span style={{ fontSize: '15px', fontWeight: 500 }}>{sec.org}</span>
              <span style={{ fontFamily: 'var(--ff-mono)', fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(20,33,28,0.4)' }}>{sec.period}</span>
            </div>
            {sec.note && (
              <p style={{ fontSize: '13px', color: 'rgba(20,33,28,0.5)', lineHeight: 1.6, margin: '0 0 1.25rem', maxWidth: '640px' }}>{sec.note}</p>
            )}
            <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fill, minmax(300px,1fr))', gap: '0.75rem' }}>
              {cards.map(card => (
                <ReelCard key={card.id} item={card} onNavigate={onNavigate} isMobile={isMobile} grid />
              ))}
            </div>
          </div>
        );
      })}
    </main>
  );
};

// ── Footer ────────────────────────────────────────────────────────────────
const Footer = ({ tweaks = {} }) => {
  const accent = tweaks.accentColor || '#D45A1B';
  const isMobile = (window.useIsMobile || (() => false))(768);
  const linkStyle = {
    fontSize: '13px', color: 'rgba(20,33,28,0.6)', textDecoration: 'none',
    fontFamily: "'Inter', system-ui, sans-serif",
    transition: 'color 150ms',
  };
  const onEnter = e => e.target.style.color = accent;
  const onLeave = e => e.target.style.color = 'rgba(20,33,28,0.6)';
  return (
    <footer id="site-footer" style={{ borderTop: '0.5px solid rgba(20,33,28,0.1)', marginTop: '0' }}>
      <div style={{
        maxWidth: '1400px', margin: '0 auto',
        padding: isMobile ? '2.5rem 1.25rem 1.5rem' : '3.5rem 2.5rem 2.5rem',
        display: 'grid',
        gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fit, minmax(220px, 1fr))',
        gap: isMobile ? '1.75rem' : '2.5rem',
        alignItems: 'start',
      }}>
        {/* Primary — name + location */}
        <div>
          <p style={{ fontSize: '15px', fontWeight: 500, color: '#14211C', marginBottom: '0.4rem', letterSpacing: '-0.005em' }}>
            Andreas Lächler
          </p>
          <p style={{ fontSize: '13px', color: 'rgba(20,33,28,0.5)', lineHeight: 1.5 }}>
            Product designer, New York.<br />
            Open to conversations about design, AI, and the physical world.
          </p>
        </div>

        {/* Contact */}
        <div>
          <p style={{ fontSize: '11px', fontWeight: 500, fontFamily: 'var(--ff-mono)', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'rgba(20,33,28,0.4)', marginBottom: '0.9rem' }}>
            Contact
          </p>
          <a href="mailto:alachler@gmail.com" style={linkStyle} onMouseEnter={onEnter} onMouseLeave={onLeave}>
            alachler@gmail.com
          </a>
        </div>

        {/* Elsewhere */}
        <div>
          <p style={{ fontSize: '11px', fontWeight: 500, fontFamily: 'var(--ff-mono)', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'rgba(20,33,28,0.4)', marginBottom: '0.9rem' }}>
            Elsewhere
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
            <a href="https://www.linkedin.com/in/andylachler" target="_blank" rel="noopener noreferrer" style={linkStyle} onMouseEnter={onEnter} onMouseLeave={onLeave}>LinkedIn</a>
          </div>
        </div>
      </div>

      <div style={{
        maxWidth: '1400px', margin: '0 auto',
        padding: isMobile ? '1rem 1.25rem 1.5rem' : '1.25rem 2.5rem 1.75rem',
        borderTop: '0.5px solid rgba(20,33,28,0.08)',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        flexWrap: 'wrap', gap: '0.75rem',
      }}>
        <span style={{ fontSize: '12px', color: 'rgba(20,33,28,0.35)' }}>
          © {new Date().getFullYear()} Andreas Lächler
        </span>
        <span style={{ fontSize: '12px', color: 'rgba(20,33,28,0.35)' }}>
          Designed & built in New York
        </span>
      </div>
    </footer>
  );
};

// ── HomePage ──────────────────────────────────────────────────────────────
const HomePage = ({ onNavigate, tweaks }) => {
  useReveal();
  const showScroll = tweaks.workDisplay !== 'grid';
  return (
    <>
      {/* ScrollRail retired from home (July 22) — the reel's own counter is
          the single progress indicator; the page scrolls independently. */}
      <Hero onNavigate={onNavigate} tweaks={tweaks} />
      {showScroll
        ? (window.Reel ? <Reel onNavigate={onNavigate} /> : <ScrollWork onNavigate={onNavigate} tweaks={tweaks} />)
        : <ProjectGrid onNavigate={onNavigate} tweaks={tweaks} />
      }
      <Footer tweaks={tweaks} />
    </>
  );
};

// ── Tweaks panel ──────────────────────────────────────────────────────────
const TweaksPanel = ({ tweaks, setTweaks, visible }) => {
  if (!visible) return null;
  const set = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
    try { localStorage.setItem('lachler_tweaks', JSON.stringify(next)); } catch {}
  };
  const Chip = ({ val, cur, onSet, label }) => {
    const active = cur === val;
    return (
      <button onClick={() => onSet(val)} style={{
        background: active ? '#14211C' : 'transparent',
        color: active ? '#F2EFE6' : '#14211C',
        border: '0.5px solid rgba(20,33,28,0.2)', borderRadius: '3px',
        padding: '4px 10px', fontSize: '12px', cursor: 'pointer',
        fontFamily: "'Inter', system-ui, sans-serif",
        marginRight: '6px', marginBottom: '6px',
        transition: 'background 120ms, color 120ms',
      }}>{label || val}</button>
    );
  };
  const Row = ({ label, children }) => (
    <div style={{ marginBottom: '1.25rem' }}>
      <p style={{ fontSize: '10px', fontWeight: 500, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(20,33,28,0.4)', marginBottom: '0.5rem' }}>{label}</p>
      <div style={{ display: 'flex', flexWrap: 'wrap' }}>{children}</div>
    </div>
  );
  return (
    <div style={{ position: 'fixed', bottom: '24px', right: '24px', zIndex: 9999, background: '#F2EFE6', border: '0.5px solid rgba(20,33,28,0.18)', borderRadius: '4px', padding: '1.5rem', width: '240px', boxShadow: '0 4px 24px rgba(20,33,28,0.12)' }}>
      <p style={{ fontSize: '11px', fontWeight: 500, fontFamily: 'var(--ff-mono)', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'rgba(20,33,28,0.4)', marginBottom: '1.5rem' }}>Tweaks</p>
      <Row label="Nav style">
        {[['sticky','Sticky'],['floating','Float'],['minimal','Minimal']].map(([v,l]) => <Chip key={v} val={v} cur={tweaks.navStyle} onSet={v => set('navStyle',v)} label={l} />)}
      </Row>
      <Row label="Hero layout">
        {[['default','Default'],['split','Split'],['large','Large']].map(([v,l]) => <Chip key={v} val={v} cur={tweaks.heroLayout} onSet={v => set('heroLayout',v)} label={l} />)}
      </Row>
      <Row label="Work display">
        {[['scroll','Scroll'],['grid','Grid']].map(([v,l]) => <Chip key={v} val={v} cur={tweaks.workDisplay} onSet={v => set('workDisplay',v)} label={l} />)}
      </Row>
      <Row label="Accent color">
        <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
          {['#D45A1B','#3D5448','#14211C'].map(c => (
            <button key={c} onClick={() => set('accentColor', c)} style={{
              width: '24px', height: '24px', borderRadius: '50%', background: c, border: 'none',
              outline: tweaks.accentColor === c ? `3px solid ${c}` : 'none',
              outlineOffset: '2px', cursor: 'pointer', transition: 'outline 120ms',
            }} />
          ))}
        </div>
      </Row>
      <Row label="Motion">
        {[['standard','Standard'],['reduced','Reduced'],['none','None']].map(([v,l]) => <Chip key={v} val={v} cur={tweaks.motionLevel} onSet={v => set('motionLevel',v)} label={l} />)}
      </Row>
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────────────
// Routing: hash-based history (#/page or #/page/project-id) layered over the
// state-based SPA. Every navigate() pushes a history entry, and popstate
// restores state — so the browser back button walks on-site navigation
// instead of leaving the website. localStorage stays as the fresh-visit
// fallback when there's no hash.
const VALID_PAGES = ['home', 'work', 'project', 'archive', 'archive-project', 'about'];
const parseHash = () => {
  const m = (window.location.hash || '').match(/^#\/([\w-]+)(?:\/([\w-]+))?/);
  if (!m || !VALID_PAGES.includes(m[1])) return null;
  return { page: m[1], id: m[2] || null };
};
const hashFor = (p, id) => '#/' + p + (id ? '/' + id : '');

const App = () => {
  const loadPage = () => { try { return localStorage.getItem('lachler_page') || 'home'; } catch { return 'home'; } };
  const loadProject = () => {
    // 'feasibility' retired July 2026 — stored state from before the
    // restructure falls back to the full product study.
    try {
      const p = localStorage.getItem('lachler_project') || 'autoease';
      return p === 'feasibility' ? 'autoease' : p;
    } catch { return 'autoease'; }
  };
  const loadTweaks = () => {
    try { return { ...TWEAK_DEFAULTS, ...JSON.parse(localStorage.getItem('lachler_tweaks') || '{}') }; }
    catch { return TWEAK_DEFAULTS; }
  };

  const initial = parseHash(); // deep link / reload beats localStorage
  const [page, setPage] = React.useState(initial ? initial.page : loadPage);
  const [projectId, setProjectId] = React.useState((initial && initial.id) || loadProject);
  const [pageKey, setPageKey] = React.useState(0);
  const [tweaks, setTweaks] = React.useState(loadTweaks);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  React.useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Seed the first history entry with a hash, then mirror back/forward into
  // React state. popstate must NOT push a new entry — it only restores.
  React.useEffect(() => {
    if (!parseHash()) {
      window.history.replaceState(null, '', hashFor(page, (page === 'project' || page === 'archive-project') ? projectId : null));
    }
    const onPop = () => {
      const h = parseHash();
      if (!h) return;
      if (h.id) {
        setProjectId(h.id);
        try { localStorage.setItem('lachler_project', h.id); } catch {}
      }
      setPage(h.page);
      setPageKey(k => k + 1);
      try { localStorage.setItem('lachler_page', h.page); } catch {}
      window.scrollTo({ top: 0, behavior: 'auto' });
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const navigate = (p, id) => {
    if ((p === 'project' || p === 'archive-project') && id) {
      setProjectId(id);
      try { localStorage.setItem('lachler_project', id); } catch {}
    }
    setPage(p);
    setPageKey(k => k + 1);
    try { localStorage.setItem('lachler_page', p); } catch {}
    window.history.pushState(null, '', hashFor(p, (p === 'project' || p === 'archive-project') ? (id || projectId) : null));
    window.scrollTo({ top: 0, behavior: tweaks.motionLevel === 'none' ? 'auto' : 'smooth' });
  };

  const motionStyle = tweaks.motionLevel === 'none'
    ? <style>{`*, *::before, *::after { transition: none !important; animation: none !important; }`}</style>
    : tweaks.motionLevel === 'reduced'
    ? <style>{`*, *::before, *::after { transition-duration: 80ms !important; animation-duration: 80ms !important; }`}</style>
    : null;

  // Home has dark hero — nav overlays it (fixed), so hero needs to fill behind nav
  const isHomeDark = page === 'home';
  const navTweaks = { ...tweaks, _darkBg: isHomeDark };

  const pagesMap = {
    home:              <HomePage onNavigate={navigate} tweaks={tweaks} />,
    work:              <><WorkPage onNavigate={navigate} /><Footer tweaks={tweaks} /></>,
    project:           <><ProjectPage projectId={projectId} onNavigate={navigate} /><Footer tweaks={tweaks} /></>,
    // 'archive' retired July 2026 — foundations live on the Work page now.
    // Kept as an alias so stored localStorage state and old links land well.
    archive:           <><WorkPage onNavigate={navigate} /><Footer tweaks={tweaks} /></>,
    'archive-project': <><ArchiveProjectPage projectId={projectId} onNavigate={navigate} /><Footer tweaks={tweaks} /></>,
    about:             <><AboutPage /><Footer tweaks={tweaks} /></>,
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {motionStyle}
      {window.Loader && tweaks.motionLevel !== 'none' && <Loader />}
      {window.Cursor && tweaks.motionLevel !== 'none' && <Cursor />}
      <Nav page={page} onNavigate={navigate} tweaks={navTweaks} />
      <div key={pageKey} className="page-enter" style={{ flex: 1 }}>
        {pagesMap[page] || pagesMap.home}
      </div>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<Gate><App /></Gate>);
</script>
</body>
</html>
